services:
  # Layanan Database MySQL Pengembangan (SIMKhanza Compatible)
  db:
    image: mysql:8.0
    container_name: e-clinic-coda-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-coda_root_password}
      MYSQL_DATABASE: ${DB_NAME:-sik}
      MYSQL_USER: ${DB_USER:-coda_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-coda_secret_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Port hanya di-bind ke 127.0.0.1 agar tidak terbuka ke jaringan luar/LAN publik
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-coda_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - coda-internal-net

  # Layanan Aplikasi Web e-clinic-coda
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e-clinic-coda-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Dalam jaringan docker compose, host db adalah nama servis 'db'
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sik}
      DB_USER: ${DB_USER:-coda_user}
      DB_PASSWORD: ${DB_PASSWORD:-coda_secret_password}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-e-clinic-coda}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-0.1.0}
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coda-internal-net

volumes:
  mysql_data:
    name: e-clinic-coda-mysql-data

networks:
  coda-internal-net:
    name: e-clinic-coda-net
    driver: bridge

